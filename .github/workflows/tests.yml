name: tests

on:
  push:
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          rm godot.zip

      - name: Import project
        run: |
          chmod +x "$GODOT"
          "$GODOT" --version
          timeout 600 "$GODOT" --headless --editor --quit --path . || true

      - name: Run headless tests
        run: |
          failed=()
          run() {
            echo "::group::$*"
            if timeout 900 "$GODOT" --headless "$@"; then echo "passed: $*"; else echo "::error::failed: $*"; failed+=("$*"); fi
            echo "::endgroup::"
          }
          run --path . "res://9. EcsSystem/tests/lifecycle_test.tscn"
          run --fixed-fps 60 --path . "res://9. EcsSystem/tests/demo_worlds_test.tscn"
          run --path . "res://10. Town Generator/tests/town_test.tscn"
          run --path . "res://10. Town Generator/tests/generator_test.tscn"
          run --path . "res://11. EcsControl/tests/control_test.tscn"
          run --path . "res://12. Settlement Generator/tests/terrain_test.tscn"
          run --path . "res://12. Settlement Generator/tests/site_test.tscn"
          run --path . "res://12. Settlement Generator/tests/road_test.tscn"
          run --path . "res://12. Settlement Generator/tests/outdoor_test.tscn"
          run --path . "res://12. Settlement Generator/tests/building_test.tscn"
          run --path . "res://12. Settlement Generator/tests/plot_test.tscn"
          run --path . "res://12. Settlement Generator/tests/census_test.tscn"
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'Failed: %s\n' "${failed[@]}"
            exit 1
          fi
